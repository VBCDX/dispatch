# Forgejo-only. This workflow runs on the canonical Forgejo repository, on a
# self-hosted runner (runs-on: self-hosted) whose jobs reach a Docker-in-Docker
# daemon over TCP at the job network's gateway. GitHub does not run it: the
# only workflow GitHub runs is .github/workflows/pages.yml. It uses no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Go: format, vet, and the full test suite on SQLite AND Postgres. Tests
  # fail (not skip) if the Postgres service is missing.
  go:
    runs-on: self-hosted
    services:
      postgres:
        # postgres:17-alpine, pinned by digest.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch-ci
          POSTGRES_DB: dispatch_test
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DISPATCH_TEST_POSTGRES_URL: postgres://dispatch:dispatch-ci@postgres:5432/dispatch_test?sslmode=disable
      DISPATCH_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Known-reachable vulnerabilities in the module graph. Source mode
      # (the default) fails only when a vulnerable symbol is reachable from
      # this code. Pinned: a new govulncheck release must not change CI
      # behaviour unannounced; bump the version in a reviewed PR.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: go test (SQLite and Postgres, race detector)
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... 2>&1 | tee test.log | grep -E '^(ok|FAIL|---|panic)|^\s+--- FAIL|_test\.go:'
      # Proof in the log that the database tests ran on the Postgres service,
      # not only on SQLite: the server version, then every Postgres subtest.
      - name: Postgres subtests ran
        shell: bash
        run: |
          grep -E 'Postgres server: PostgreSQL ' test.log || { echo "TestPostgresIsReal did not reach the Postgres service"; exit 1; }
          if grep -E -- '--- SKIP: .*(/postgres|TestPostgresIsReal)' test.log; then echo "Postgres tests were skipped"; exit 1; fi
          grep -E '^\s+--- PASS: .*/postgres ' test.log
          n=$(grep -cE '^\s+--- PASS: .*/postgres ' test.log)
          echo "$n Postgres subtests passed"
          [ "$n" -ge 8 ] || { echo "expected at least 8 Postgres subtests; is DISPATCH_TEST_POSTGRES_URL set?"; exit 1; }

  # Send-to-receive latency through embedded NATS, one node: the browser
  # WebSocket proof, and the agent message path (/agent/v1/ws, token check
  # from memory, JetStream durable consumer). No threshold yet: thresholds
  # get set from these first numbers.
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: WebSocket pub/sub latency (p50, p99)
        run: go test -run '^$' -bench WebSocketPubSub -benchtime 5000x -count 1 ./internal/server
      - name: Agent send→receive latency (p50, p99)
        run: go test -run '^$' -bench AgentSendReceive -benchtime 5000x -count 1 ./internal/server

  # The web unit tests (privacy filter, sign-in marker) plus the build exactly
  # as the Dockerfile runs it.
  web:
    runs-on: self-hosted
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # One audit, the explicit gate below: install quietly (--no-audit) so
      # the only audit is the one that fails on high or critical advisories.
      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: npm audit (fail on high and critical advisories)
        working-directory: web
        run: npm audit --audit-level=high
      # vitest + jsdom: the analytics allowlist/sanitization and the sign-in
      # accounting.
      - name: npm test
        working-directory: web
        run: npm test
      - name: npm run build
        working-directory: web
        run: npm run build
      - name: Build output exists
        run: test -s web/dist/index.html && ls web/dist/assets/*.js web/dist/assets/*.css

  # Build the real root Dockerfile against the runner's DinD daemon, then
  # boot the image and check it answers its health check. The daemon is
  # reachable over TCP at the job network's gateway, not at the unix socket.
  docker:
    runs-on: self-hosted
    steps:
      - name: Point docker at the DinD daemon
        run: |
          gwhex=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
          gw=$(printf "%d.%d.%d.%d" "0x${gwhex:6:2}" "0x${gwhex:4:2}" "0x${gwhex:2:2}" "0x${gwhex:0:2}")
          echo "DOCKER_HOST=tcp://$gw:2375" >> "$GITHUB_ENV"
          echo "Resolved DinD daemon at tcp://$gw:2375"
      - name: Daemon reachable
        run: docker version
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: docker build
        run: docker build --network=host -t dispatch:ci-${{ github.run_id }} .
      - name: Image boots (SQLite, non-root) and passes its health check
        run: |
          name=dispatch-ci-${{ github.run_id }}
          docker run -d --name "$name" dispatch:ci-${{ github.run_id }}
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$name" /usr/local/bin/dispatch healthcheck; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "container never became healthy"; exit 1
      # The runtime image must stay distroless.
      # A shell or a network client is a containment reduction (no interpreter
      # to run, no downloader to fetch a second stage or exfiltrate), so this
      # fails if one is ever copied back in.
      - name: Runtime image has no shell and no network client
        shell: bash
        run: |
          name=dispatch-ci-noshell-${{ github.run_id }}
          docker run -d --name "$name" dispatch:ci-${{ github.run_id }}
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect -f '{{.Config.User}}' "$name")" = "65532:65532"
          # The guard fails closed (pipefail, empty or truncated listing) and
          # checks by class (nothing but the app binary in a bin directory) as
          # well as by name. Its own self-test runs first.
          scripts/check-runtime-image.test.sh
          set -o pipefail
          docker export "$name" | scripts/check-runtime-image.sh
      # The deploy platform must rely on the built-in check (the image
      # HEALTHCHECK, run by direct exec, no shell) or on an external
      # `HTTP GET /healthz` probe. This proves the built-in check reaches
      # healthy on its own, and that a pushed commit cannot silently drop it.
      - name: Docker's built-in healthcheck reaches healthy
        run: |
          name=dispatch-ci-health-${{ github.run_id }}
          docker run -d --name "$name" dispatch:ci-${{ github.run_id }}
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect -f '{{json .Config.Healthcheck.Test}}' "$name")" = '["CMD","/usr/local/bin/dispatch","healthcheck"]'
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name")
            if [ "$status" = "healthy" ]; then echo "built-in healthcheck healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "built-in healthcheck never reported healthy (last status: ${status:-none})"; exit 1

  # What a stranger does with a clean clone. `.env` comes from
  # `.env.example` with only the values the README says to set
  # (POSTGRES_PASSWORD, plus a throwaway BOOTSTRAP_ADMIN_* first account), and
  # no Zitadel or other OIDC provider anywhere. Then `docker compose up -d
  # --build`, both services healthy, the probes in scripts/docker-smoke.sh
  # (healthz, readyz, the sign-in page, a bootstrap-admin sign-in), and the
  # same probes against the single container on SQLite.
  compose:
    runs-on: self-hosted
    env:
      # One project per run, so leftovers or a concurrent run on the same
      # daemon cannot collide. A stranger's project is just the directory name.
      COMPOSE_PROJECT_NAME: dispatch-ci-${{ github.run_id }}
      # Compose binds 127.0.0.1:${DISPATCH_PORT:-8080} on the DinD host, which
      # this job container cannot reach anyway: the probes run on the compose
      # network. Port 0 lets Docker pick a free one, so two runs on one daemon
      # never fight over 8080. Shell env overrides .env; .env stays untouched.
      DISPATCH_PORT: "0"
    steps:
      - name: Point docker at the DinD daemon
        run: |
          gwhex=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
          gw=$(printf "%d.%d.%d.%d" "0x${gwhex:6:2}" "0x${gwhex:4:2}" "0x${gwhex:2:2}" "0x${gwhex:0:2}")
          echo "DOCKER_HOST=tcp://$gw:2375" >> "$GITHUB_ENV"
          echo "Resolved DinD daemon at tcp://$gw:2375"
      - name: Daemon and compose reachable
        run: docker version && docker compose version
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: .env from .env.example (POSTGRES_PASSWORD and a bootstrap admin only)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          cp .env.example .env
          # Throwaway values for this run only. URL-safe, as .env.example asks.
          pg=$(openssl rand -hex 16)
          admin=$(openssl rand -hex 16)
          echo "::add-mask::$pg"
          echo "::add-mask::$admin"
          set_env() { # set_env KEY VALUE: the key must already be listed, blank
            grep -qx "$1=" .env || { echo "$1= is not a blank line in .env.example"; exit 1; }
            sed -i "s|^$1=\$|$1=$2|" .env
          }
          set_env POSTGRES_PASSWORD "$pg"
          set_env BOOTSTRAP_ADMIN_EMAIL admin@example.com
          set_env BOOTSTRAP_ADMIN_PASSWORD "$admin"
          # Proof of what changed: exactly these three lines, nothing else.
          # (diff exits 1 when the files differ, which they must.)
          changed=$(diff .env.example .env | grep '^>' || true)
          sed -E 's/^(> [A-Z_]*PASSWORD=).*/\1(masked)/' <<<"$changed"
          test "$(wc -l <<<"$changed")" = 3
          # The sign-in settings a stranger gets: local mode, no client.
          grep -E '^(AUTH_MODE|OIDC_[A-Z_]+)=' .env
      - name: docker compose up -d --build
        run: docker compose up -d --build
      - name: Compose stack smoke test (Postgres, local sign-in, no OIDC)
        run: scripts/docker-smoke.sh compose
      # The single container, as the README's no-compose path: SQLite in the
      # /data volume, a bootstrap admin, nothing else. It reuses the image
      # compose just built.
      - name: Single container on SQLite (docker run)
        shell: bash
        run: |
          set -euo pipefail
          image=$(docker inspect -f '{{.Image}}' "$(docker compose ps -q dispatch)")
          docker network create "$COMPOSE_PROJECT_NAME-sqlite" >/dev/null
          set -a; eval "$(grep -E '^BOOTSTRAP_ADMIN_(EMAIL|PASSWORD)=' .env)"; set +a
          docker run -d --name "$COMPOSE_PROJECT_NAME-sqlite" --network "$COMPOSE_PROJECT_NAME-sqlite" \
            -v "$COMPOSE_PROJECT_NAME-sqlite-data:/data" \
            -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD "$image"
          scripts/docker-smoke.sh container "$COMPOSE_PROJECT_NAME-sqlite"
      - name: Service logs (on failure)
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --timestamps || true
          docker logs "$COMPOSE_PROJECT_NAME-sqlite" || true
      - name: docker compose down -v
        if: always()
        run: |
          docker rm -f "$COMPOSE_PROJECT_NAME-sqlite" >/dev/null 2>&1 || true
          docker volume rm "$COMPOSE_PROJECT_NAME-sqlite-data" >/dev/null 2>&1 || true
          docker network rm "$COMPOSE_PROJECT_NAME-sqlite" >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans || true
